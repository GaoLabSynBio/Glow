# Cross-platform conda environment for Glow (Linux / macOS / Windows).
#
# This lists only the direct dependencies with loose lower bounds and NO
# platform-specific build strings, so conda can solve it on any OS. For a
# byte-for-byte reproducible Linux environment, use `environment.lock.linux.yml`
# instead (a full `conda env export`).
#
#   conda env create -f environment.yml
#   conda activate glow_env
name: glow_env
channels:
  - conda-forge
  - cytoflow
dependencies:
  - python>=3.10,<3.13
  - pip
  # Core UI
  - streamlit>=1.40
  # Flow cytometry
  - cytoflow>=1.3
  # Scientific stack
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pyarrow>=12
  - joblib>=1.3
  # Plotting
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.18
  # Utilities
  - platformdirs>=3.0
  - tqdm>=4.65
  - openpyxl>=3.1          # read .xlsx metadata spreadsheets
