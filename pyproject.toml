[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glow"
version = "0.1.0"
description = "A user-friendly flow analysis pipeline with pretty UI and Active Learning capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Haoyu Dai", email = "dhy@stanford.edu"},
]
keywords = ["flow cytometry", "active learning", "streamlit", "analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
    "altair>=6.0.0",
    "cytoflow>=1.3.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.5.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "streamlit>=1.52.2",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glow*", "ui*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
